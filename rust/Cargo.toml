[workspace]
resolver = "2"
members = ["abifusion-core", "abifusion"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of abifusion: build Solidity ABIs from EVM bytecode by fusing signature databases with evmole static analysis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
